<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7C2D12" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#B45309" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#FDE68A" stroke-width="8" stroke-opacity="0.4" />

  <!-- Math Symbol Ornaments in Background Corners -->
  <g opacity="0.22" fill="#FFFFFF">
    <!-- Plus symbol top left -->
    <rect x="72" y="88" width="40" height="12" rx="6" />
    <rect x="86" y="74" width="12" height="40" rx="6" />

    <!-- Multiply symbol top right -->
    <g transform="translate(390, 88) rotate(45)">
      <rect x="-20" y="-6" width="40" height="12" rx="6" />
      <rect x="-6" y="-20" width="12" height="40" rx="6" />
    </g>

    <!-- Division symbol bottom left -->
    <rect x="72" y="400" width="40" height="10" rx="5" />
    <circle cx="92" cy="380" r="7" />
    <circle cx="92" cy="428" r="7" />

    <!-- Equals symbol bottom right -->
    <rect x="380" y="394" width="42" height="10" rx="5" />
    <rect x="380" y="416" width="42" height="10" rx="5" />
  </g>

  <!-- Central Shield / Badge -->
  <g filter="url(#dropShadow)">
    <path d="M256,92 C320,92 370,116 380,188 C380,296 296,376 256,412 C216,376 132,296 132,188 C142,116 192,92 256,92 Z" fill="url(#shieldGrad)" />
  </g>

  <!-- Golden Crown / Tiara over Shield Top -->
  <g filter="url(#glow)">
    <path d="M196,120 L220,152 L256,108 L292,152 L316,120 L308,168 L204,168 Z" fill="url(#goldGrad)" />
    <circle cx="196" cy="116" r="6" fill="#FDE047" />
    <circle cx="256" cy="104" r="8" fill="#FDE047" />
    <circle cx="316" cy="116" r="6" fill="#FDE047" />
  </g>

  <!-- Stylized Energetic Letter "K" (for KAFA MATH) with Math Accent -->
  <!-- Vertical Stem of K -->
  <rect x="200" y="196" width="28" height="144" rx="14" fill="#C2410C" />
  
  <!-- Upper diagonal arm of K with arrow-like tip -->
  <path d="M224,272 L296,204 C304,196 316,198 322,206 C328,214 326,226 318,234 L258,288 Z" fill="#EA580C" />
  
  <!-- Lower diagonal leg of K -->
  <path d="M246,276 L318,342 C326,350 326,362 318,370 C310,378 298,378 290,370 L224,304 Z" fill="#C2410C" />

  <!-- Sparkling Explorer Star on top right of the K -->
  <path d="M336,180 Q348,180 348,168 Q348,180 360,180 Q348,180 348,192 Q348,180 336,180 Z" fill="#F59E0B" />
  <circle cx="348" cy="180" r="3" fill="#FFF" />
</svg>
